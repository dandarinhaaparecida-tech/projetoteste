
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="css/stylecdprodutos.css">
</head>
<body>

    <div class="container">

        <h1>Gerenciamento de Produtos</h1>

        <h2 id="tituloFormulario">Cadastrar produto</h2>

        <form id="formProduto">

            <input type="hidden" id="produtoId">

            <label>Nome do produto</label>
            <input type="text" id="nome" placeholder="Nome do produto" required>

            <label>Preço</label>
            <input type="number" id="preco" placeholder="Preço" step="0.01" min="0.01" required>

            <label>Descrição</label>
            <textarea id="descricao" placeholder="Descrição do produto"></textarea>

            <label>Imagem (URL)</label>
            <input type="url" id="imagem" placeholder="https://imagem.com/produto.jpg" required>

            <button type="submit" id="botaoSalvar">Cadastrar produto</button>

            <button type="button" id="botaoCancelar" onclick="novoProduto()">
                Cancelar edição
            </button>

            <p id="mensagem"></p>

        </form>

        <h2>Lista de produtos</h2>

        <input
            type="text"
            id="pesquisa"
            placeholder="Pesquisar produto..."
        >

        <div class="tabela-container">
            <table>

                <thead>
                    <tr>
                        <th>Imagem</th>
                        <th>Nome</th>
                        <th>Preço</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="listaProdutos"></tbody>

            </table>
        </div>

    </div>

    <script src="js/js/gerenciar-produtos.js"></script>

</body>
</html>
