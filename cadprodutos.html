<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Administrativo - Minha Loja</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f3f5;
            font-family: Arial, sans-serif;
        }

        .login-container {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,.12);
        }

        h1 {
            text-align: center;
            color: #222;
        }

        .descricao {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 7px;
            background: #222;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #444;
        }

        .voltar {
            background: #198754;
        }

        .voltar:hover {
            background: #146c43;
        }

        #mensagem {
            text-align: center;
            font-size: 14px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>MINHA LOJA.</h1>

        <p class="descricao">
            Acesso exclusivo administrativo
        </p>

        <form id="formLogin">

            <label for="email">E-mail Hotmail</label>

            <input
                type="email"
                id="email"
                placeholder="seunome@hotmail.com"
                autocomplete="username"
                required
            >

            <label for="senha">Senha</label>

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                autocomplete="current-password"
                required
            >

            <button type="submit">
                Entrar no sistema
            </button>

            <p id="mensagem" aria-live="polite"></p>

        </form>
        <button type="button" id="btnGoogle" class="google-btn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                 alt="Google"
                 width="20">
            Entrar com Google
        </button>
        <button
            type="button"
            class="voltar"
            id="btnVoltar">
            ← Voltar para a loja
        </button>

    </div>
    <script type="module" src="js/login.js"></script>
</body>
</html>
